name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { node-version: 22.x, lint: true, tests: true }
          - { node-version: 24.x, lint: true, tests: true }

    name: nodejs ${{ matrix.node-version }} (${{ matrix.lint && 'lint → ' || '' }}${{ matrix.tests && 'test → ' || '' }}build)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org/'

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v6
        env:
          cache-name: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}

      - name: Cache eslint
        id: cache-eslint
        uses: actions/cache@v6
        env:
          cache-name: cache-eslint
        with:
          path: .eslintcache
          key: ${{ env.cache-name }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}

      - name: Cache TypeScript
        id: cache-typescript
        uses: actions/cache@v6
        env:
          cache-name: cache-typescript
        with:
          path: .tsbuildinfo
          key: ${{ env.cache-name }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}

      - name: Cache prettier
        id: cache-prettier
        uses: actions/cache@v6
        env:
          cache-name: cache-prettier
        with:
          path: node_modules/.cache/prettier/.prettier-cache
          key: ${{ env.cache-name }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}

      - name: Install dependencies
        run: npm install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}

      - name: Lint the project
        run: npm run lint
        if: ${{ matrix.lint }}

      - name: Run tests
        run: npm test
        if: ${{ matrix.tests }}

      - name: Upload code coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage/lcov.info
        if: ${{ matrix.node-version == '22.x' }}

      - name: Build the project
        run: npm run build

      - name: Pack Project Artifact
        run: npm pack

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-prometheus-exporter-dist
          path: |
            dist/
            *.tgz
          retention-days: 7
        if: ${{ matrix.node-version == '22.x' }}

      - name: Commit and Push Changes
        if: ${{ github.event_name == 'push' && matrix.node-version == '22.x' && (github.ref_name == 'main' || github.ref_name == 'develop') }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add src/generated/ package-lock.json
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated build and generated files update [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi

      # - name: Publish to NPM
      #   if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.node-version == '22.x' }}
      #   run: npm publish
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.node-version == '22.x' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
