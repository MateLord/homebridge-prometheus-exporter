name: Build Artifact and Commit

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Pack Project Artifact
        run: npm pack

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebridge-prometheus-exporter-dist
          path: |
            dist/
            *.tgz
          retention-days: 7

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage changed files (e.g. auto-generated services list or lockfile updates)
          git add src/generated/ package-lock.json
          
          # Check if there are changes to commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: automated build and generated files update [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
